<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saturn • Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="images/logoimg.png" alt="Saturn logo">
      <span>Saturn</span>
    </a>

    <div style="margin-top:24px;">
      <h1 class="auth-title">Join Saturn</h1>
      <p class="auth-subtitle">Create your account and start posting.</p>
    </div>

    <div id="registerMessage" class="message hidden"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" class="input" required>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" class="input" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" minlength="6" required>
      </div>

      <button class="btn btn-primary btn-full" type="submit">Create Account</button>
    </form>

    <p class="form-footer">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
