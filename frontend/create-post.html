<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saturn • Create Post</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="images/logoimg.png" alt="Saturn logo">
        <span>Saturn</span>
      </a>
      <a class="btn btn-secondary" href="index.html">Back to Home</a>
    </div>
  </header>

  <main class="container">
    <div class="card auth-card" style="margin:auto;">
      <h1 class="auth-title">Create a post</h1>
      <p class="auth-subtitle">Share something with the Saturn community.</p>

      <form onsubmit="createStandalonePost(event)">
        <div class="form-group">
          <label for="standaloneContent">Content</label>
          <textarea id="standaloneContent" class="textarea" required></textarea>
        </div>

        <div class="form-group">
          <label for="standaloneImage">Image path</label>
          <input id="standaloneImage" class="input" placeholder="images/post1.jpg">
        </div>

        <button class="btn btn-primary btn-full" type="submit">Publish Post</button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    requireAuth();

    async function createStandalonePost(event) {
      event.preventDefault();

      try {
        await apiFetch("/posts", {
          method: "POST",
          body: JSON.stringify({
            content: document.getElementById("standaloneContent").value,
            image: document.getElementById("standaloneImage").value
          })
        });

        showToast("Post published.");
        setTimeout(() => window.location.href = "index.html", 700);
      } catch (error) {
        showToast(error.message);
      }
    }
  </script>
</body>
</html>
