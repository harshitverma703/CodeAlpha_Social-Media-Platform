<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saturn • Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="images/logoimg.png" alt="Saturn logo">
      <span>Saturn</span>
    </a>

    <div style="margin-top:24px;">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to continue to Saturn.</p>
    </div>

    <div id="loginMessage" class="message hidden"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">Username or Email</label>
        <input id="login" class="input" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" required>
      </div>

      <button class="btn btn-primary btn-full" type="submit">Login</button>
    </form>

    <p class="form-footer">
      Don't have an account?
      <a href="register.html">Create one</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
